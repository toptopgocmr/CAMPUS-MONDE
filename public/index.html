<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Monde — Étudier à l'international</title>
<meta property="og:title" content="Campus Monde — Étudier à l'international">
<meta property="og:description" content="Orientation, admission, bourses, logement et visa études : déposez et suivez votre candidature en ligne.">
<meta name="theme-color" content="#14296E">
<meta name="description" content="Campus Monde : orientation, admission, bourses, logement et visa études. Plateforme bilingue de candidature et de suivi des dossiers étudiants à l'international.">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/logo.jpg">
<meta property="og:image" content="/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=Fraunces:ital,opsz,wght@1,9..144,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --royal:#1B3A8C; --royal-2:#244BAA; --royal-d:#132B6B; --ink:#0E1B3D; --ink-2:#2A3654; --muted:#5A6580;
  --line:#DCE2EE; --line-2:#E9EDF5; --mist:#F1F4FA; --white:#FFFFFF; --orange:#E8691B; --orange-d:#C8540D; --orange-l:#FDEBDD;
  --ok:#1E7B4A; --warn:#A35F00; --err:#B3261E; --r:10px;
  --fd:'Bricolage Grotesque',system-ui,sans-serif; --fs:'Fraunces',Georgia,'Times New Roman',serif; --fb:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* compat (espaces) */ --blue:var(--royal); --blue-2:var(--royal-2); --blue-3:var(--royal-2); --sky:#E7EDFA; --bg:var(--mist); --orange-d2:var(--orange-d);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--fb);font-size:17px;line-height:1.6;color:var(--ink);background:var(--white);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fd);color:var(--ink);margin:0 0 .45em;font-weight:700;letter-spacing:-.015em}
h1{font-size:clamp(2.1rem,4.6vw,3.6rem);line-height:1.04;letter-spacing:-.025em}
h2{font-size:clamp(1.6rem,2.8vw,2.35rem);line-height:1.12}
h3{font-size:1.14rem;line-height:1.3;font-weight:650;letter-spacing:-.005em}
p{margin:0 0 1em}
a{color:var(--royal-2);text-underline-offset:3px}
img{max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.muted{color:var(--muted)} .small{font-size:.87rem} .center{text-align:center}
.lead{font-size:1.14rem;line-height:1.6;color:var(--muted);max-width:60ch}
.i{flex:none;vertical-align:-3px}
:focus-visible{outline:3px solid #8FB0F5;outline-offset:2px;border-radius:4px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:1.5px solid transparent;border-radius:8px;padding:.78em 1.25em;font:600 .97rem var(--fb);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn-lg{padding:.95em 1.5em;font-size:1.02rem}
.btn-sm{padding:.52em .9em;font-size:.86rem}
.btn-o{background:var(--orange);color:#fff} .btn-o:hover{background:var(--orange-d)}
.btn-b{background:var(--royal);color:#fff} .btn-b:hover{background:var(--royal-d)}
.btn-g{background:#fff;color:var(--ink);border-color:var(--line)} .btn-g:hover{border-color:var(--royal);color:var(--royal)}
.btn-w{background:#fff;color:var(--royal)}
.btn-ghost-w{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)} .btn-ghost-w:hover{border-color:#fff;background:rgba(255,255,255,.08)}
.btn-wa{background:#1E7B4A;color:#fff} .btn-wa:hover{background:#17623A}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.link{font-weight:600;color:var(--royal-2);text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:1px;white-space:nowrap}
.link:hover{color:var(--orange-d)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:600;padding:.22em .62em;border-radius:6px;background:#E7EDFA;color:var(--royal);white-space:nowrap}
.tag.ok{background:#E2F2E9;color:var(--ok)} .tag.warn{background:#FCEFD9;color:var(--warn)} .tag.err{background:#FBE5E3;color:var(--err)} .tag.or{background:var(--orange-l);color:var(--orange-d)} .tag.grey{background:#ECEFF4;color:#4E5872}

/* Header */
.topbar{background:var(--ink);color:#C3CCE0;font-size:.82rem}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;height:36px}
.topbar a{color:#C3CCE0;text-decoration:none} .topbar a:hover{color:#fff}
.tb-r{display:flex;gap:18px}
#tb-l{display:flex;align-items:center;gap:6px}
header.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line-2);transition:box-shadow .2s}
header.top.scrolled{box-shadow:0 4px 18px rgba(14,27,61,.07)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:18px;height:76px}
header .wrap.nav{max-width:1320px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
.logo-img{height:56px;width:auto;display:block}
.slogan{font:italic 500 .84rem var(--fb);color:var(--muted);max-width:120px;line-height:1.25;border-left:1px solid var(--line);padding-left:12px}
.menu{display:flex;align-items:center;gap:2px}
.menu>a{position:relative;padding:.55em .62em;text-decoration:none;color:var(--ink-2);font-weight:550;font-size:.93rem;white-space:nowrap;border-radius:6px}
.menu>a:hover{color:var(--royal)}
.menu>a.on{color:var(--royal)}
.menu>a.on::after{content:"";position:absolute;left:.62em;right:.62em;bottom:-2px;height:2px;background:var(--orange);border-radius:2px}
.navr{display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.lang button{border:0;background:none;padding:.4em .62em;font:600 .78rem var(--fb);cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--ink);color:#fff}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:42px;height:42px;cursor:pointer;color:var(--ink);font-size:1.3rem}
.mob-only{display:none!important}
@media(max-width:1540px){.slogan{display:none}}
@media(max-width:1380px){
  .menu{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;padding:8px 24px 20px;border-bottom:1px solid var(--line);box-shadow:0 14px 30px rgba(14,27,61,.1)}
  .menu.open{display:flex} .menu>a{padding:.8em 0;border-bottom:1px solid var(--line-2);border-radius:0} .menu>a.on::after{display:none}
  .burger{display:grid;place-items:center} .menu .mob-only{display:block!important}
}
@media(max-width:760px){.navr .hide-m{display:none}#tb-l{display:none}.topbar .wrap{justify-content:center}.tb-r a:not(:first-child){display:none}.logo-img{height:48px}.nav{height:68px}}

/* Hero */
.hero{background:var(--royal);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 80% 70%,rgba(255,255,255,.07),transparent 60%),linear-gradient(180deg,rgba(0,0,0,0),rgba(10,20,60,.25));pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-top:72px;padding-bottom:80px}
.hero h1{color:#fff;max-width:15ch}
.hero .lead{color:#D3DDF4;max-width:52ch;margin-bottom:28px}
.finder{display:grid;grid-template-columns:1fr 1fr auto;gap:0;background:#fff;border-radius:12px;padding:8px;box-shadow:0 22px 50px rgba(5,15,50,.35);max-width:620px}
.finder label{display:flex;flex-direction:column;padding:6px 14px;border-right:1px solid var(--line-2);margin:0}
.finder label span{font-size:.74rem;font-weight:600;color:var(--muted)}
.finder select{border:0;padding:2px 0;font:600 .98rem var(--fb);color:var(--ink);background:transparent;width:100%;cursor:pointer}
.finder select:focus{outline:none}
.finder label:focus-within{background:var(--mist);border-radius:8px}
.finder .btn{margin-left:8px}
.hero-proof{list-style:none;display:flex;flex-wrap:wrap;gap:10px 26px;padding:0;margin:26px 0 0;font-size:.92rem;color:#D3DDF4}
.hero-proof li{display:flex;align-items:center;gap:8px}
.hero-proof .i{color:#FFB37A}
.hero-map{position:relative}
.routes{width:100%;height:auto;display:block}
.routes .grid path{stroke:rgba(255,255,255,.09);stroke-width:1}
.routes .eq{stroke:rgba(255,255,255,.22);stroke-width:1;stroke-dasharray:2 6}
.routes .arc{fill:none;stroke:#FF8A3D;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.6,0,.2,1) forwards}
.routes .dst{fill:#fff;stroke:var(--royal);stroke-width:3}
.routes .home{fill:#FF8A3D}
.routes .home-ring{fill:none;stroke:#FF8A3D;stroke-opacity:.45;stroke-width:2}
.routes .code{font:700 20px var(--fd);fill:#fff;letter-spacing:.02em}
.routes .city{font:500 13px var(--fb);fill:#BFCBEA}
.routes a:hover .arc{stroke:#FFC08F;stroke-width:3.2}
.routes a:hover .code{fill:#FFC08F}
.map-note{font-size:.84rem;color:#AFC0E6;margin:6px 0 0;text-align:right}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.routes .arc{animation:none;stroke-dashoffset:0}html{scroll-behavior:auto}}
@media(max-width:960px){.hero-in{grid-template-columns:1fr;padding-top:44px;padding-bottom:52px;gap:28px}.hero-map{max-width:520px}}
@media(max-width:620px){.finder{grid-template-columns:1fr}.finder label{border-right:0;border-bottom:1px solid var(--line-2);padding:10px 12px}.finder .btn{margin:8px 0 0}}

/* Blocks */
.block{padding:88px 0}
.block-mist{background:var(--mist)}
.block-ink{background:var(--ink);color:#D5DCEC}
.block-ink h2,.block-ink h3{color:#fff}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:36px;flex-wrap:wrap}
.head-row h2{margin:0}
.head-row p{margin:.5em 0 0;max-width:62ch}
.split{display:grid;grid-template-columns:.85fr 1.15fr;gap:64px;align-items:start}
.split-rev{grid-template-columns:1fr 1fr;align-items:center}
.split-intro{position:sticky;top:110px}
.split-rev .split-intro{position:static}
.split-intro p{color:var(--muted);max-width:52ch}
.split-art{display:block;width:100%;max-width:400px;border-radius:12px;margin:8px 0 24px;border:1px solid var(--line-2)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
@media(max-width:900px){.split,.split-rev,.two-col{grid-template-columns:1fr;gap:40px}.split-intro{position:static}.block{padding:64px 0}}

/* Services list */
.svc-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.svc-list li{display:grid;grid-template-columns:52px 1fr;gap:18px;padding:24px 0;border-bottom:1px solid var(--line)}
.svc-list h3{margin:.2em 0 .3em}
.svc-list p{margin:0;color:var(--muted)}
.svc-ic{display:grid;place-items:center;width:48px;height:48px;border-radius:10px;background:#E7EDFA;color:var(--royal)}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:32px}
.svc-card{background:#fff;padding:32px}
.svc-card h3{margin-top:18px}
.svc-card p{color:var(--muted);margin:0}

/* Destinations */
.dest-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
@media(max-width:1000px){.dest-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.dest-grid{grid-template-columns:1fr}}
.dest{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .15s}
.dest:hover{border-color:var(--royal-2)}
.dest-art{position:relative;aspect-ratio:400/260;overflow:hidden;background:var(--royal)}
.dest-art img{width:100%;height:100%;object-fit:cover;display:block}
.dest-code{position:absolute;left:14px;bottom:12px;font:700 1.5rem var(--fd);color:#fff;letter-spacing:.03em;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.dest-body{padding:18px 20px 20px}
.dest-body h3{font-size:1.3rem;margin-bottom:.15em}
.dest-body p{margin:0 0 10px;color:var(--muted);font-size:.94rem}
.dest-meta{font-size:.84rem;font-weight:600;color:var(--royal-2)}

/* Journey */
.journey{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative}
.journey::before{content:"";position:absolute;left:22px;right:22px;top:22px;height:2px;background:linear-gradient(90deg,var(--orange),rgba(232,105,27,.25))}
.journey li{position:relative;padding:0 22px 0 0}
.j-n{position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--ink);border:2px solid var(--orange);color:#fff;font:700 1.05rem var(--fd);margin-bottom:20px}
.journey h3{font-size:1.08rem}
.journey p{font-size:.93rem;color:#AEB9D3;margin:0}
@media(max-width:900px){.journey{grid-template-columns:1fr;gap:26px}.journey::before{left:22px;right:auto;top:10px;bottom:10px;width:2px;height:auto}.journey li{padding:0 0 0 70px}.j-n{position:absolute;left:0;top:-4px}}

/* Frame / checks */
.frame{margin:0;background:var(--mist);border:1px solid var(--line);border-radius:16px;padding:28px}
.frame img{display:block;width:100%;border-radius:10px}
.checks{list-style:none;margin:18px 0 0;padding:0}
.checks li{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
.checks .i{color:var(--ok);margin-top:3px}

/* Institutions */
.inst-list{border-top:1px solid var(--line)}
.inst-row{display:grid;grid-template-columns:1.6fr 1.2fr .8fr auto 24px;gap:18px;align-items:center;padding:18px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.inst-row:hover{background:#fff}
.block-mist .inst-row:hover{background:#fff}
.inst-row:hover .inst-name{color:var(--royal-2)}
.inst-name{font:650 1.06rem var(--fd)}
.inst-loc,.inst-n{color:var(--muted);font-size:.93rem}
.inst-row>.i{color:var(--muted)}
.inst-list.compact .inst-row{grid-template-columns:1fr auto 20px}
.inst-list.compact .inst-loc,.inst-list.compact .inst-n{display:none}
@media(max-width:760px){.inst-row{grid-template-columns:1fr auto;gap:6px 12px}.inst-loc{grid-column:1}.inst-n{display:none}.inst-row>.i{display:none}.inst-row .tag{grid-row:1;grid-column:2}}
.partner-note{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;margin-top:36px;padding:26px 30px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:12px}
.partner-note h3{margin:0 0 .2em}.partner-note p{margin:0;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px 28px;font-size:.9rem;color:var(--muted);margin-bottom:24px}
.legend>span{display:flex;align-items:center;gap:8px}
.filters{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.f-inline{display:flex;align-items:center;gap:10px;margin:0;font-weight:600;font-size:.9rem}
.f-inline select{width:auto;min-width:220px}

/* Programmes */
.search-bar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:14px}
.sb-q{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:9px;padding:0 14px;background:#fff;margin:0;color:var(--muted)}
.sb-q input{border:0;padding:.78em 0;outline:none}
.sb-q:focus-within{border-color:var(--royal-2)}
@media(max-width:760px){.search-bar{grid-template-columns:1fr}}
.prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;margin-bottom:28px}
.prog-stack{display:grid;gap:16px}
.prog-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column}
.prog-top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.prog-card h3{font-size:1.2rem;margin-bottom:.2em}
.prog-inst{color:var(--muted);margin:0 0 14px}
.prog-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 20px;padding:14px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.prog-facts dt{font-size:.76rem;color:var(--muted)} .prog-facts dd{margin:0;font-weight:600;font-size:.93rem}
.prog-card .btn{align-self:flex-start;margin-top:auto}
.empty{grid-column:1/-1;text-align:center;padding:48px;border:1px dashed var(--line);border-radius:12px}

/* Office / FAQ / CTA */
.office{background:var(--ink);color:#D5DCEC;border-radius:16px;padding:34px}
.office h3{color:#fff;font-size:1.35rem}
.office ul{list-style:none;margin:16px 0 0;padding:0}
.office li{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.office li .i{color:#FFB37A;margin-top:3px}
details.faq{border-bottom:1px solid var(--line);padding:4px 0}
details.faq:first-of-type{border-top:1px solid var(--line)}
details.faq summary{cursor:pointer;list-style:none;font-weight:600;font-size:1.04rem;padding:16px 32px 16px 0;position:relative}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"";position:absolute;right:6px;top:50%;width:10px;height:10px;border-right:2px solid var(--royal);border-bottom:2px solid var(--royal);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
details.faq[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
details.faq p{margin:0 0 18px;color:var(--muted);max-width:62ch}
.two-col>div>.link{display:inline-block;margin-top:22px}
.cta-band{background:var(--royal);color:#fff;padding:64px 0}
.cta-in{display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap}
.cta-band h2{color:#fff;margin:0 0 .3em}.cta-band p{margin:0;color:#D3DDF4}
.cta-act{display:flex;gap:12px;flex-wrap:wrap}
.news{padding:18px 0;border-bottom:1px solid var(--line)}
.news time{font-size:.85rem;color:var(--orange-d);font-weight:600}
.news h3{margin:.3em 0}.news p{margin:0}

/* Page header (inner pages) */
.page-h{background:var(--mist);border-bottom:1px solid var(--line-2);padding:52px 0 56px}
.page-h h1{font-size:clamp(2rem,4vw,3rem);max-width:20ch}
.page-h .lead{margin:0}
.crumb{display:flex;flex-wrap:wrap;gap:8px;font-size:.86rem;color:var(--muted);margin-bottom:16px}
.crumb a{color:var(--muted)} .crumb a:hover{color:var(--royal)}
.ph-grid{display:grid;grid-template-columns:1fr 380px;gap:48px;align-items:center}
.ph-art{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
.ph-art img{display:block;width:100%}
.route-line{display:flex;align-items:center;gap:10px;margin:22px 0 0;font:700 1.05rem var(--fd);color:var(--royal)}
.route-line span{flex:0 0 60px;height:2px;background:repeating-linear-gradient(90deg,var(--orange) 0 6px,transparent 6px 11px)}
@media(max-width:860px){.ph-grid{grid-template-columns:1fr}.ph-art{display:none}.page-h{padding:36px 0 40px}}

/* About */
.id-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px}
.id-card dl{margin:16px 0 0}
.id-card dl>div{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:12px 0;border-top:1px solid var(--line-2)}
.id-card dt{color:var(--muted);font-size:.9rem} .id-card dd{margin:0;font-weight:500}
@media(max-width:560px){.id-card dl>div{grid-template-columns:1fr;gap:2px}}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.trio h3{margin-top:18px}
@media(max-width:860px){.trio{grid-template-columns:1fr;gap:28px}}
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-bottom:16px}
.member{border-top:2px solid var(--ink);padding-top:18px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--mist);display:grid;place-items:center;color:var(--muted);margin-bottom:14px}
@media(max-width:860px){.team{grid-template-columns:repeat(2,1fr)}}
.prose h2{margin-top:1.4em}.prose h2:first-child{margin-top:0}.prose p{max-width:68ch}
.narrow{max-width:820px}
.tl{list-style:none;margin:20px 0 0;padding:0;counter-reset:t}
.tl li{position:relative;display:flex;flex-direction:column;padding:0 0 22px 48px;counter-increment:t}
.tl li::before{content:counter(t);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--royal);color:#fff;display:grid;place-items:center;font:700 .88rem var(--fd)}
.tl li::after{content:"";position:absolute;left:14px;top:34px;bottom:4px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl strong{font-family:var(--fd)} .tl span{color:var(--muted)}
.doc-box{background:var(--mist);border:1px solid var(--line);border-radius:14px;padding:30px}
.doc-box ul{list-style:none;margin:14px 0 18px;padding:0}
.doc-box li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.doc-box li .i{color:var(--royal);margin-top:3px}
.form-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px}

/* Forms */
label{display:block;font-weight:600;font-size:.88rem;margin:0 0 6px;color:var(--ink)}
.f{margin-bottom:16px}
input,select,textarea{width:100%;padding:.74em .9em;border:1.5px solid var(--line);border-radius:9px;font:inherit;font-size:.97rem;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--royal-2);box-shadow:0 0 0 3px rgba(36,75,170,.15)}
textarea{min-height:130px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px} @media(max-width:620px){.row2{grid-template-columns:1fr}}
.chk{display:block;position:relative;padding-left:28px;font-weight:400;font-size:.9rem}
.chk input{width:auto;position:absolute;left:0;top:3px;margin:0}
.err-msg{color:var(--err);font-size:.86rem;margin:4px 0 10px}
.alert{padding:13px 16px;border-radius:9px;margin-bottom:16px;font-size:.93rem}
.alert.ok{background:#E2F2E9;color:#145232} .alert.err{background:#FBE5E3;color:#7E1E18} .alert.info{background:#E7EDFA;color:var(--royal-d)}
.notice{border-left:3px solid var(--orange);background:#FFF6EE;padding:14px 18px;border-radius:0 9px 9px 0;font-size:.93rem;color:var(--ink-2);margin-top:24px}
.notice.blue{border-color:var(--royal-2);background:#EEF2FB}

/* Generic (espaces & back-office) */
section.sec{padding:64px 0} section.alt{background:var(--mist)}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}
.card.flat{box-shadow:none}
.card h3{margin-top:.1em}
.ico{width:44px;height:44px;border-radius:10px;background:#E7EDFA;color:var(--royal);display:grid;place-items:center;margin-bottom:12px}
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
th{background:var(--mist);font-weight:600;color:var(--muted);font-size:.8rem;white-space:nowrap}
tr:last-child td{border-bottom:0}
.card table th{white-space:normal} td{overflow-wrap:anywhere}
tr.click{cursor:pointer} tr.click:hover td{background:#F7F9FD}
.shell{display:grid;grid-template-columns:250px 1fr;gap:28px;padding:36px 0 72px}
.shell>*{min-width:0}
@media(max-width:860px){.shell{grid-template-columns:1fr}}
.side{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;height:max-content;position:sticky;top:96px}
@media(max-width:860px){.side{position:static;display:flex;overflow-x:auto;gap:4px}}
.side button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:.66em .8em;border-radius:8px;font:550 .92rem var(--fb);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.side button .i{color:var(--muted)}
.side button.on,.side button:hover{background:#EEF2FB;color:var(--royal)} .side button.on .i{color:var(--royal)}
.side .who{padding:10px 10px 14px;border-bottom:1px solid var(--line-2);margin-bottom:8px}
@media(max-width:860px){.side .who{display:none}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.kpi b{font:700 2rem var(--fd);color:var(--ink);display:block;line-height:1.1}
.kpi span{color:var(--muted);font-size:.86rem}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 18px 30px}
.timeline li:before{content:"";position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child:before{display:none}
.timeline li i{position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;border:2.5px solid var(--line)}
.timeline li.done i{background:var(--ok);border-color:var(--ok)} .timeline li.cur i{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 5px var(--orange-l)}
.timeline li.cur b{color:var(--orange-d)}
.prog{height:7px;background:var(--line-2);border-radius:99px;overflow:hidden;margin:8px 0 18px}
.prog>div{height:100%;background:var(--orange);transition:.3s}
.wiz{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.wiz span{font-size:.84rem;font-weight:600;color:var(--muted);padding:.4em .85em;border-radius:7px;background:var(--mist)}
.wiz span.on{background:var(--royal);color:#fff} .wiz span.done{background:#E2F2E9;color:var(--ok)}
.msg{padding:10px 14px;border-radius:12px;margin-bottom:10px;max-width:85%;font-size:.93rem}
.msg.me{background:var(--royal);color:#fff;margin-left:auto} .msg.them{background:var(--mist)}
.msg small{display:block;opacity:.75;font-size:.75rem;margin-top:3px}
.docrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.docrow:last-child{border-bottom:0}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cols-a{grid-template-columns:1.3fr 1fr}.cols-b{grid-template-columns:1fr 1.3fr}.cols-f3{grid-template-columns:2fr 1fr 1fr}.cols-f4{grid-template-columns:2fr 1fr 1fr 1fr}
@media(max-width:860px){.cols-a,.cols-b,.cols-f3,.cols-f4{grid-template-columns:1fr!important}}
.kick{display:block;color:var(--orange-d);font-weight:600;font-size:.88rem;margin-bottom:6px}
.sec-h{max-width:720px;margin-bottom:30px}

/* Modal, toast, WhatsApp */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,50,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(260px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;z-index:200;transition:.3s;font-size:.93rem;max-width:90vw;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.wa-float{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:#1E7B4A;color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.25);z-index:60}
.wa-float:hover{background:#17623A}
.demo-ribbon{background:#FCEFD9;color:#6E4100;font-size:.8rem;text-align:center;padding:6px 12px}
.demo-ribbon button{background:none;border:0;color:var(--orange-d);font-weight:700;cursor:pointer;text-decoration:underline;font-size:.8rem}

/* Footer */
footer{background:var(--ink);color:#AEB9D3;padding:64px 0 26px;font-size:.92rem}
footer h4{color:#fff;font-size:1rem;margin-bottom:14px}
footer a{color:#D5DCEC;text-decoration:none} footer a:hover{color:#fff}
footer ul{list-style:none;padding:0;margin:0} footer li{margin-bottom:9px}
.foot-g{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.3fr;gap:40px}
@media(max-width:900px){.foot-g{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.foot-g{grid-template-columns:1fr}}
.foot-logo{height:78px;background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:16px;display:block}
.foot-meta{font-size:.84rem;color:#8E9AB8}
.foot-contact li{display:flex;gap:10px}.foot-contact .i{color:#FFB37A;margin-top:3px}
.foot-b{border-top:1px solid rgba(255,255,255,.1);margin-top:44px;padding-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:.84rem}
.foot-legal{display:flex;gap:18px;flex-wrap:wrap}
/* Mega menu */
.menu{align-self:stretch}
.mm-item{display:flex;align-items:stretch}
.mm-top{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0 .68em;font:550 .93rem var(--fb);color:var(--ink-2);cursor:pointer;position:relative;white-space:nowrap}
.mm-top:hover,.mm-item.open>.mm-top{color:var(--royal)}
.mm-top .chev{opacity:.55;transition:transform .2s}
.mm-item.on>.mm-top{color:var(--royal)}
.mm-item.on>.mm-top::after,.mm-link.on::after{content:"";position:absolute;left:.68em;right:.68em;bottom:0;height:2px;background:var(--orange);border-radius:2px}
.mm-link{display:flex!important;align-items:center;padding:0 .68em!important;text-decoration:none;color:var(--ink-2);font-weight:550;font-size:.93rem;position:relative;white-space:nowrap}
.mm-link:hover{color:var(--royal)}
.mm-panel{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line);box-shadow:0 26px 40px rgba(14,27,61,.12);z-index:49}
.mm-item.open>.mm-panel{display:block}
.mm-item.open .chev{transform:rotate(180deg)}
@media(hover:hover) and (min-width:1381px){.mm-item:hover>.mm-panel{display:block}.mm-item:hover .chev{transform:rotate(180deg)}.mm-item:hover>.mm-top{color:var(--royal)}}
.mm-in{display:flex;gap:56px;padding-top:30px;padding-bottom:34px;max-width:1200px}
.mm-col{flex:1;min-width:0}
.mm-h{font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 10px}
.mm-col ul{list-style:none;padding:0;margin:0}
.mm-col a{display:block;padding:7px 0;color:var(--ink);text-decoration:none;font-weight:500;font-size:.98rem}
.mm-col a:hover{color:var(--royal-2)}
.mm-feat{flex:0 0 400px;display:flex;gap:16px;align-items:center;background:var(--mist);border-radius:12px;padding:14px;text-decoration:none;color:inherit;align-self:flex-start}
.mm-feat:hover{background:#E7EDFA}
.mm-feat img{width:150px;border-radius:8px;display:block;flex:none}
.mm-feat strong{display:block;font-family:var(--fd);font-size:1.05rem;margin-bottom:4px;color:var(--ink)}
.mm-feat span span{display:block;color:var(--muted);font-size:.9rem;line-height:1.45}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.icon-btn:hover{border-color:var(--royal);color:var(--royal)}
@media(max-width:1380px){
  .menu{align-self:auto}
  .mm-item{flex-direction:column;align-items:stretch}
  .mm-top{padding:.85em 0;justify-content:space-between;border-bottom:1px solid var(--line-2);font-size:1rem}
  .mm-item.on>.mm-top::after,.mm-link.on::after{display:none}
  .mm-link{padding:.85em 0!important;border-bottom:1px solid var(--line-2);font-size:1rem}
  .mm-panel{position:static;box-shadow:none;border:0;background:var(--mist)}
  .mm-in{flex-direction:column;gap:6px;padding:10px 16px 14px}
  .mm-feat{display:none}
}
/* Quick access */
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero-in{padding-bottom:116px}
.quick{position:relative;margin-top:-52px;z-index:2}
.quick-h{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.quick-grid{display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 44px rgba(14,27,61,.14);overflow:hidden}
.quick-t{display:flex;flex-direction:column;gap:12px;padding:24px 20px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.97rem;border-right:1px solid var(--line-2);line-height:1.3}
.quick-t:last-child{border-right:0}
.quick-t .i{color:var(--orange)}
.quick-t:hover{background:var(--mist);color:var(--royal)}
@media(max-width:1000px){.quick-grid{grid-template-columns:repeat(3,1fr)}.quick-t{border-bottom:1px solid var(--line-2)}}
@media(max-width:520px){.quick-grid{grid-template-columns:repeat(2,1fr)}.quick-t{padding:18px 16px}}
/* Guides */
.guide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:900px){.guide-grid{grid-template-columns:1fr}}
.guide-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px;text-decoration:none;color:inherit}
.guide-card:hover{border-color:var(--royal-2)}
.guide-card h3{margin:16px 0 6px}
.guide-card p{color:var(--muted);font-size:.95rem;flex:1}
.link-sm{font-weight:600;color:var(--royal-2);font-size:.92rem}
.guide-layout{display:grid;grid-template-columns:260px 1fr;gap:56px;align-items:start}
.guide-nav{position:sticky;top:100px}
.guide-nav ul{list-style:none;margin:0;padding:0;border-left:2px solid var(--line-2)}
.guide-nav a{display:flex;gap:10px;align-items:center;padding:9px 14px;margin-left:-2px;border-left:2px solid transparent;color:var(--ink-2);text-decoration:none;font-weight:500}
.guide-nav a:hover{color:var(--royal)}
.guide-nav a.on{border-left-color:var(--orange);color:var(--royal);font-weight:600}
@media(max-width:900px){.guide-layout{grid-template-columns:1fr}.guide-nav{position:static}}
.steps-v{list-style:none;margin:0;padding:0}
.steps-v li{display:grid;grid-template-columns:48px 1fr;gap:20px;padding-bottom:28px;position:relative}
.steps-v li::before{content:"";position:absolute;left:21px;top:46px;bottom:4px;width:2px;background:var(--line)}
.steps-v li:last-child::before{display:none}
.sv-n{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--royal);color:#fff;font:700 1.05rem var(--fd)}
.steps-v h3{margin:.45em 0 .3em}.steps-v p{color:var(--muted);margin:0;max-width:62ch}
.official{background:var(--mist);border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin-top:8px}
.official ul{list-style:none;padding:0;margin:8px 0}
.official li{padding:5px 0}.official a{font-weight:600}
/* News */
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:900px){.news-grid{grid-template-columns:1fr}}
.news-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-top:3px solid var(--royal);border-radius:4px 4px 12px 12px;padding:24px;text-decoration:none;color:inherit}
.news-card:hover h3{color:var(--royal-2)}
.nc-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.nc-meta time{font-size:.85rem;color:var(--muted)}
.news-card h3{font-size:1.15rem}.news-card p{color:var(--muted);font-size:.95rem;margin:0}
.news-layout{display:grid;grid-template-columns:1fr 340px;gap:40px;align-items:start}
.news-layout .news-grid{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.news-layout{grid-template-columns:1fr}.news-layout .news-grid{grid-template-columns:1fr}}
.agenda{background:var(--ink);color:#D5DCEC;border-radius:14px;padding:28px}
.agenda h3{color:#fff}
.agenda ul{list-style:none;margin:10px 0 20px;padding:0}
.agenda li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.agenda li .i{color:#FFB37A;margin-top:3px}
.agenda strong{display:block;color:#fff;font-weight:600}.agenda li span{font-size:.88rem;color:#AEB9D3}
/* Search modal */
.search-modal label{font:700 1.3rem var(--fd);margin-bottom:14px}
.sm-row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:6px 6px 6px 14px;color:var(--muted)}
.sm-row:focus-within{border-color:var(--royal-2)}
.sm-row input{border:0;padding:.6em 0;font-size:1.05rem;box-shadow:none!important}
.sm-links{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 20px}
.sm-links a{padding:8px 0;border-bottom:1px solid var(--line-2);text-decoration:none;color:var(--ink);font-weight:500}
.sm-links a:hover{color:var(--royal-2)}
/* Newsletter */
footer{padding-top:0}
.foot-nl{background:var(--royal-d);padding:44px 0;margin-bottom:56px;color:#D3DDF4}
.nl-in{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.foot-nl h3{color:#fff;font-size:1.35rem;margin-bottom:.3em}.foot-nl p{margin:0}
.nl-row{display:flex;gap:10px;margin-bottom:10px}
.nl-row input{border-color:transparent}
.foot-nl .chk{color:#C3CCE0;font-size:.84rem}
.nl-msg{min-height:1.2em;font-size:.86rem;color:#FFC08F;margin-top:6px!important}
.nl-ok{display:flex;gap:8px;align-items:center;color:#fff;font-weight:600}
@media(max-width:860px){.nl-in{grid-template-columns:1fr}.nl-row{flex-direction:column}}
.foot-g{grid-template-columns:1.4fr 1fr 1fr 1fr 1.25fr;gap:32px}
@media(max-width:1000px){.foot-g{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.foot-g{grid-template-columns:1fr}}
/* Photo slots */
.photo{position:relative;overflow:hidden;background:linear-gradient(135deg,#E3E9F5,#CCD7EC)}
.photo>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;display:block}
.ph-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;color:#4A5A80;font-size:.88rem;font-weight:600;line-height:1.3}
.ph-ph small{font-weight:500;font-size:.76rem;opacity:.8}
.dest-art .photo,.hero-bg .photo{position:absolute;inset:0}
.ph-art .photo{aspect-ratio:4/3}
.split-art{display:block;width:100%;max-width:440px;border-radius:12px;overflow:hidden;margin:8px 0 24px}
.split-art .photo{aspect-ratio:4/3}
.frame{padding:0;overflow:hidden}.frame .photo{aspect-ratio:16/11}
.mm-feat .photo{width:150px;aspect-ratio:4/3;border-radius:8px;flex:none}
.mm-feat .ph-ph{font-size:.7rem;padding:6px}.mm-feat .ph-ph small{display:none}
.hero-bg{position:absolute;inset:0}
.hero-bg .photo{background:linear-gradient(120deg,#1B3A8C,#132B6B)}
.hero-bg .ph-ph{align-items:flex-end;justify-content:flex-start;color:rgba(255,255,255,.6);padding:28px 40px;z-index:3}
.hero::before{z-index:2;background:linear-gradient(90deg,rgba(19,43,107,.96) 0%,rgba(19,43,107,.88) 38%,rgba(19,43,107,.35) 75%,rgba(19,43,107,.15) 100%)}
.hero-in{z-index:3;grid-template-columns:minmax(0,640px)!important;padding-top:96px;padding-bottom:140px;min-height:620px;align-content:center}
.hero .lead{color:#E1E8F7}
@media(max-width:960px){.hero::before{background:rgba(19,43,107,.86)}.hero-in{min-height:0;padding-top:52px;padding-bottom:110px}}
/* Console (espace étudiant & administration) */
body.console{background:#F2F4F8}
body.console .topbar,body.console header.top,body.console>footer,body.console .wa-float{display:none!important}
.cs{min-height:100vh;display:flex;flex-direction:column}
.cs-top{position:sticky;top:0;z-index:70;height:54px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid #22305A}
.cs-brand{display:flex;align-items:center;text-decoration:none}
.cs-brand img{height:34px;background:#fff;border-radius:6px;padding:2px 5px;display:block}
.cs-svc{font:600 .98rem var(--fd);color:#E3E9F7;padding-left:14px;border-left:1px solid #34436B;white-space:nowrap}
.cs-search{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:#18275A;border:1px solid #4B5C8C;border-radius:8px;color:#AEB9D3;margin-left:10px}
.cs-search:focus-within{border-color:#8FB0F5;background:#1D2E66}
.cs-search input{border:0;background:transparent;color:#fff;padding:0;font-size:.92rem;box-shadow:none!important;height:32px}
.cs-search input::placeholder{color:#94A1C2}
.cs-fill{flex:1}
.cs-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.cs-region{display:flex;align-items:center;gap:6px;font-size:.84rem;color:#C3CCE0;padding:0 10px}
.cs-lang{display:flex;border:1px solid #34436B;border-radius:6px;overflow:hidden;margin:0 6px}
.cs-lang button{border:0;background:none;color:#AEB9D3;font:600 .74rem var(--fb);padding:5px 8px;cursor:pointer}
.cs-lang button.on{background:#fff;color:var(--ink)}
.cs-ic,.cs-user-btn{position:relative;display:flex;align-items:center;gap:7px;height:36px;padding:0 10px;border:0;border-radius:6px;background:none;color:#E3E9F7;font:600 .88rem var(--fb);cursor:pointer}
.cs-ic:hover,.cs-user-btn:hover,.cs-user.open .cs-user-btn{background:rgba(255,255,255,.1)}
.cs-dot{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--orange);color:#fff;font-size:.68rem;display:grid;place-items:center}
.cs-user{position:relative}
.cs-user-btn span{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);width:270px;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 12px 32px rgba(10,20,50,.25);padding:6px;z-index:80}
.cs-user.open .cs-menu{display:block}
.cs-menu-h{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;border-bottom:1px solid var(--line-2);margin-bottom:6px;font-size:.85rem;color:var(--muted)}
.cs-menu-h b{color:var(--ink);font-size:.95rem}
.cs-role{color:var(--royal-2)!important;font-weight:600}
.cs-menu a,.cs-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;background:none;border-radius:6px;color:var(--ink);text-decoration:none;font:500 .9rem var(--fb);cursor:pointer;text-align:left}
.cs-menu a:hover,.cs-menu button:hover{background:var(--mist)}
.cs-body{flex:1;display:grid;grid-template-columns:260px minmax(0,1fr)}
.cs-nav{background:#fff;border-right:1px solid #DCE1EA;padding:20px 0;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
.cs-nav-h{font:700 1.08rem var(--fd);padding:0 22px 16px;margin-bottom:8px;border-bottom:1px solid var(--line-2)}
.cs-nav button,.cs-nav a{display:flex;align-items:center;gap:11px;width:100%;padding:8px 22px 8px 19px;background:none;border:0;border-left:3px solid transparent;font:500 .93rem var(--fb);color:#3D4A66;text-decoration:none;cursor:pointer;text-align:left}
.cs-nav button span,.cs-nav a span{flex:1}
.cs-nav .i{color:#7A86A3}
.cs-nav button:hover,.cs-nav a:hover{color:var(--royal);background:#F5F7FC}
.cs-nav button.on{color:var(--royal);font-weight:700;border-left-color:var(--orange);background:#EEF2FB}
.cs-nav button.on .i{color:var(--royal)}
.cs-count{font-style:normal;background:var(--orange);color:#fff;font-size:.72rem;font-weight:700;border-radius:9px;padding:1px 7px}
.cs-nav-sep{height:1px;background:var(--line-2);margin:14px 22px}
.cs-main{padding:18px 36px 56px;min-width:0}
.cs-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.86rem;color:#5F6B85;margin-bottom:16px}
.cs-crumbs a{color:var(--royal-2);text-decoration:none}.cs-crumbs a:hover{text-decoration:underline}
.cs-sep{color:#9AA5BE}
.cs-flash{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:10px;margin-bottom:18px;color:#fff;background:var(--royal-2);font-size:.93rem}
.cs-flash.ok{background:#1E7B4A}.cs-flash.err{background:#B3261E}
.cs-flash a{color:#fff;text-decoration:underline}
.cs-content>h2,.cs-content h2{font:700 1.55rem var(--fd);margin:0 0 18px;letter-spacing:-.01em}
.cs-content .card{background:#fff;border:0;border-radius:12px;box-shadow:0 1px 1px rgba(14,27,61,.22),1px 1px 1px rgba(14,27,61,.1),-1px 1px 1px rgba(14,27,61,.1);padding:20px 22px}
.cs-content .card>h3:first-child{margin:-20px -22px 16px;padding:14px 22px;border-bottom:1px solid var(--line-2);font:700 1.02rem var(--fd)}
.cs-content .card>h3:first-child .i{color:var(--muted)}
.cs-content .tbl-w{border:0;border-radius:12px;box-shadow:0 1px 1px rgba(14,27,61,.22),1px 1px 1px rgba(14,27,61,.1),-1px 1px 1px rgba(14,27,61,.1)}
.cs-content th{background:#fff;color:#3D4A66;font-size:.82rem;font-weight:700;border-bottom:1px solid #DCE1EA;padding:12px 14px}
.cs-content td{padding:12px 14px;border-bottom:1px solid #EEF1F6}
.cs-content tr.click:hover td{background:#F5F7FC}
.cs-content tr.click td:first-child b{color:var(--royal-2)}
.cs-content .kpi{background:#fff;border:0;border-radius:12px;box-shadow:0 1px 1px rgba(14,27,61,.22),1px 1px 1px rgba(14,27,61,.1),-1px 1px 1px rgba(14,27,61,.1);display:flex;flex-direction:column-reverse;gap:6px;padding:18px 20px}
.cs-content .kpi span{font-size:.86rem;font-weight:600;color:#3D4A66}
.cs-content .kpi b{font:700 2.1rem var(--fd);color:var(--royal-2)}
.cs-content .tag{background:none!important;padding:0;border-radius:0;font-weight:600;font-size:.86rem;color:var(--royal-2);gap:6px}
.cs-content .tag::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.cs-content .tag.ok{color:#1E7B4A}.cs-content .tag.warn{color:#A35F00}.cs-content .tag.err{color:#B3261E}.cs-content .tag.or{color:#C8540D}.cs-content .tag.grey{color:#5F6B85}
.cs-content .btn{border-radius:20px;padding:.5em 1.1em;font-size:.9rem}
.cs-content .btn-sm{padding:.36em .9em;font-size:.84rem}
.cs-content .btn-g{border:2px solid var(--royal-2);color:var(--royal-2)}
.cs-content .btn-g:hover{background:#EEF2FB}
.cs-content input,.cs-content select,.cs-content textarea{border:1px solid #8C97B1;border-radius:8px;padding:.55em .8em;font-size:.93rem}
.cs-content input:focus,.cs-content select:focus,.cs-content textarea:focus{border-color:var(--royal-2);box-shadow:0 0 0 2px rgba(36,75,170,.35)}
.cs-content .alert{border-radius:10px}
.cs-content .grid{gap:18px}
.cs-content .prog{height:6px}
.cs-content .wiz span{border-radius:20px}
.cs-content .docrow{padding:12px 0}
.cs-content p>a[data-act]:only-child{font-weight:600;text-decoration:none}
@media(max-width:620px){.cs-content .g4{grid-template-columns:repeat(2,1fr)}.cs-content .kpi b{font-size:1.7rem}}
.cs-foot{display:flex;gap:18px;align-items:center;height:40px;padding:0 20px;background:var(--ink);color:#AEB9D3;font-size:.8rem}
.cs-foot a{color:#C3CCE0;text-decoration:none}
@media(max-width:1000px){.cs-region{display:none}}
@media(max-width:860px){
  .cs-body{grid-template-columns:1fr}
  .cs-nav{position:sticky;top:54px;height:auto;display:flex;overflow-x:auto;padding:0 8px;border-right:0;border-bottom:1px solid #DCE1EA;z-index:60}
  .cs-nav-h,.cs-nav-sep,.cs-nav a{display:none}
  .cs-nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:12px 12px}
  .cs-nav button.on{border-bottom-color:var(--orange);background:none}
  .cs-main{padding:14px 16px 40px}
  .cs-search{display:none}
  .cs-user-btn span,.cs-svc{display:none}
}
.hidden{display:none!important}
/* ===== Console & espace étudiant — écrans enrichis ===== */
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;flex:none;color:#fff;font-weight:700;background:#1B3A8C;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
.cs-user-btn .av{box-shadow:none}
.cx-who{display:flex;align-items:center;gap:12px;min-width:0}
.cx-who b{color:var(--ink)}
.cx-ok{color:var(--ok);display:inline-flex;vertical-align:middle}
.cx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.cx-head h2{margin:0}
.cx-head p{margin:4px 0 0}
.cx-tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:.42em .8em;border-radius:7px;font:600 .82rem var(--fb);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--royal);color:#fff}
.cx-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.cx-kpis.k5{grid-template-columns:repeat(5,1fr)}
.cx-kpi{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 1px 1px rgba(14,27,61,.22),1px 1px 1px rgba(14,27,61,.1),-1px 1px 1px rgba(14,27,61,.1);display:flex;flex-direction:column;gap:6px;border:2px solid transparent;text-align:left;font:inherit}
.cx-kpi.click{cursor:pointer}.cx-kpi.click:hover,.cx-kpi.sel{border-color:var(--royal-2)}
.cx-kpi-h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.84rem;font-weight:600;color:#3D4A66}
.cx-kpi-h span{display:inline-flex;gap:6px;align-items:center}
.cx-kpi>b{font:700 1.75rem var(--fd);color:var(--ink);line-height:1.15}
.cx-d{font-size:.76rem;font-weight:700;color:var(--muted);white-space:nowrap}
.cx-d.up{color:var(--ok)}.cx-d.down{color:var(--err)}
.cx-spark{display:block;margin-top:2px}
.cx-pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.cx-pipe button{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font:600 .84rem var(--fb);color:var(--ink-2);text-align:left}
.cx-pipe button:hover{border-color:var(--royal-2)}
.cx-pipe i,.cx-chips i,.cx-donut li i{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.cx-pipe span{flex:1}.cx-pipe b{font:700 1.15rem var(--fd);color:var(--ink)}
.cx-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.cx-grid3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.cx-chart{width:100%;height:auto;display:block}
.cx-kpi-f{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px}

.cx-grid{stroke:#E9EDF5;stroke-width:1}.cx-base{stroke:#C9D2E3;stroke-width:1}
.cx-ax{font:10.5px var(--fb);fill:#6B7690}
.cx-hit:hover{fill:rgba(27,58,140,.06)}
.cx-dn-v{font:700 26px var(--fd);fill:var(--ink)}
.cx-bars{display:flex;flex-direction:column;gap:12px}
.cx-bar.click{cursor:pointer}
.cx-bar-l{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;margin-bottom:5px}
.cx-bar-l b{color:var(--ink)}
.cx-bar-t{height:10px;background:#EEF1F7;border-radius:5px;overflow:hidden}
.cx-bar-t i{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}
.cx-donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.cx-donut svg{flex:none}
.cx-donut path,.cx-donut circle{cursor:default}
.cx-donut ul{list-style:none;margin:0;padding:0;flex:1;min-width:170px}
.cx-donut li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:.85rem}
.cx-donut li.click{cursor:pointer}.cx-donut li.click:hover span{text-decoration:underline}
.cx-donut li span{flex:1}.cx-donut li em{font-style:normal;color:var(--muted);font-size:.78rem;width:40px;text-align:right}
.cx-funnel>div{display:grid;grid-template-columns:120px 1fr 34px 44px;gap:10px;align-items:center;padding:7px 0;font-size:.86rem}
.cx-funnel-t{height:14px;background:#EEF1F7;border-radius:4px;overflow:hidden}
.cx-funnel-t i{display:block;height:100%;background:linear-gradient(90deg,#1B3A8C,#2a78d6);border-radius:0 4px 4px 0}
.cx-funnel b{text-align:right}.cx-funnel em{font-style:normal;color:var(--muted);font-size:.78rem}
.cx-tbl{width:100%}
.cx-tbl td{vertical-align:middle}
.cx-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.cx-row>div{flex:1;min-width:0}
.cx-row.click{cursor:pointer}.cx-row.click:hover{background:#F7F9FD}
.cx-feed{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:.88rem}
.cx-feed>i{width:8px;height:8px;border-radius:50%;background:var(--royal-2);margin-top:7px;flex:none;box-shadow:0 0 0 3px #E7EDFA}
.cx-day{font:700 .74rem var(--fb);text-transform:uppercase;letter-spacing:.06em;color:var(--orange-d);margin:14px 0 4px}
.cx-day:first-child{margin-top:0}
.cx-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cx-chips button{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:.42em .9em;font:600 .84rem var(--fb);color:var(--ink-2);cursor:pointer}
.cx-chips button b{background:#EEF1F7;border-radius:999px;padding:0 .5em;font-size:.76rem}
.cx-chips button.on{background:var(--royal);border-color:var(--royal);color:#fff}
.cx-chips button.on b{background:rgba(255,255,255,.2)}
.cx-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cx-filters select{width:auto;min-width:160px}
.cx-search{flex:1;min-width:240px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--muted)}
.cx-search input{border:0!important;box-shadow:none!important;padding:.65em 0;background:none}
.cx-mini{height:6px;background:#EEF1F7;border-radius:4px;overflow:hidden;width:70px;margin-bottom:3px}
.cx-mini.big{width:100%;max-width:320px;height:8px;margin:2px 0 6px}
.cx-mini i{display:block;height:100%;background:var(--ok);border-radius:4px}
.cx-pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:12px}
.cx-empty{text-align:center;padding:30px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.cx-empty b{color:var(--ink-2)}
.cx-empty p{margin:0 0 8px}
.cx-split{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.cx-sel{width:auto;padding:.35em .5em}
.cx-list{display:flex;flex-direction:column;gap:8px}
.cx-mail{background:#fff;border-radius:10px;box-shadow:0 1px 1px rgba(14,27,61,.18);padding:0}
.cx-mail summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.cx-mail summary::-webkit-details-marker{display:none}
.cx-mail[open] summary{border-bottom:1px solid var(--line-2)}
.cx-mail>p{margin:10px 16px;font-size:.9rem}
.cx-mail-m{flex:1;min-width:0;display:flex;flex-direction:column}
.cx-mail-m b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-when{white-space:nowrap}
.cx-mi{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:#E7EDFA;color:var(--royal)}
.cx-mi.int{background:#FDEBDD;color:var(--orange-d)}.cx-mi.sec{background:#ECEFF4;color:#4E5872}
.cx-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.cx-lead p{font-size:.9rem;margin:12px 0}
.cx-actions{display:flex;gap:8px;flex-wrap:wrap}
.cx-settings .cx-set-row{display:grid;grid-template-columns:220px 1fr auto;gap:18px;align-items:end}
.cx-checks{display:flex;gap:14px;flex-wrap:wrap}
.cx-checks label{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:.88rem;cursor:pointer}
.cx-checks input{width:auto}
.cx-settings{margin-bottom:16px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
#cx-tip{position:fixed;z-index:9999;pointer-events:none;background:#0E1B3D;color:#fff;font-size:.8rem;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .1s;max-width:280px;box-shadow:0 6px 18px rgba(14,27,61,.25)}
#cx-tip.on{opacity:1}
/* Étudiant */
.st-hero{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
.st-hero-a{display:flex;gap:18px;align-items:center;flex:1;min-width:280px}
.st-check{list-style:none;margin:0;padding:0;display:grid;gap:8px;min-width:240px}
.st-check li{display:flex;gap:10px;align-items:center;font-size:.9rem}
.st-check li>span{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.st-check li.ok>span{background:var(--ok);border-color:var(--ok);color:#fff}
.st-check li.ok{color:var(--muted)}
.st-apps{display:grid;gap:14px}
.st-app{cursor:pointer;transition:transform .12s}.st-app:hover{transform:translateY(-1px)}
.st-app-h{display:flex;gap:12px;align-items:center}
.st-flag{font-size:1.6rem;line-height:1}
.st-steps{list-style:none;display:flex;margin:16px 0 12px;padding:0}
.st-steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.74rem;color:var(--muted);position:relative;text-align:center}
.st-steps li::before{content:'';position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.st-steps li:first-child::before{display:none}
.st-steps li i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line);z-index:1}
.st-steps li.done i{background:var(--ok);border-color:var(--ok)}.st-steps li.done::before{background:var(--ok)}
.st-steps li.on i{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-l)}.st-steps li.on{color:var(--ink);font-weight:600}.st-steps li.on::before{background:var(--ok)}
.st-app-f{display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line-2);padding-top:10px}
.st-app-f span{display:inline-flex;gap:5px;align-items:center}
.st-go{margin-left:auto;color:var(--royal-2);font-weight:700}
.st-progs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.st-prog{display:flex;flex-direction:column}
.st-prog-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st-prog h3{margin:12px 0 4px;font-size:1.02rem}
.st-prog-m{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);margin:6px 0 14px;flex:1}
.st-prog-m span{display:inline-flex;gap:5px;align-items:center}
.st-prof{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.st-photo .req{color:var(--err)}
.st-photo-box{width:180px;height:180px;margin:0 auto;border-radius:50%;overflow:hidden;background:#EEF1F7;display:flex;align-items:center;justify-content:center;color:#9AA3B5;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--line)}
.st-photo-box.missing{box-shadow:0 0 0 4px #fff,0 0 0 6px #F3B7B2}
.st-photo-box img{width:100%;height:100%;object-fit:cover}
.st-rules{margin:12px 0 0;padding-left:18px}
.st-rules li{margin:3px 0}
.st-note{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:10px;box-shadow:0 1px 1px rgba(14,27,61,.18);padding:14px 16px}
.st-note>div{flex:1}.st-note p{margin:4px 0 0;font-size:.9rem;color:var(--ink-2)}
.st-note.new{box-shadow:inset 3px 0 0 var(--orange),0 1px 1px rgba(14,27,61,.18)}
.st-sec{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.rc-grid>div:has(.rc-photo){display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-content:start}
.rc-grid>div:has(.rc-photo)>h4{grid-column:1/-1}
.rc-photo{width:84px;height:104px;object-fit:cover;border-radius:6px;border:1px solid #E6EAF2}
/* Paiement (étudiant) */
.pay-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line-2);padding-bottom:14px;margin-bottom:14px}
.pay-amt{font:800 2rem var(--fd);color:var(--ink);line-height:1.1;margin:2px 0}
.pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pm-opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;font:inherit}
.pm-opt.on{border-color:var(--royal-2);box-shadow:0 0 0 3px #E7EDFA}
.pm{display:inline-block;font:800 .72rem var(--fb);padding:.3em .6em;border-radius:6px;letter-spacing:.02em}

@media (prefers-reduced-motion:reduce){.cx-live i,.cx-kpi.bump,.cx-pipe button.bump{animation:none}.cx-kpi.click:hover,.cx-pipe button:hover{transform:none}}

h1,h2,h3{text-wrap:balance;font-feature-settings:"ss01","kern"}
p,li{text-wrap:pretty}
h1 em,h2 em,.promo-in h2 em{font-family:var(--fs);font-style:italic;font-weight:500;letter-spacing:-.01em;color:var(--orange-d);font-variation-settings:"opsz" 120,"SOFT" 50,"WONK" 1;padding-right:.04em}
.hero h1 em,.block-ink h2 em,.cta-band h2 em,.promo-in h2 em{color:#FFB37A}
.hero h1{font-size:clamp(2.4rem,5vw,4rem);line-height:1.02;letter-spacing:-.035em;font-weight:800;max-width:16ch}
.hero h1 .u{position:relative;white-space:nowrap;font-style:normal;font-family:var(--fd);font-weight:800;color:#fff}
.hero h1 .u svg{position:absolute;left:-2%;bottom:-.16em;width:104%;height:.32em;overflow:visible;pointer-events:none}
.hero h1 .u path{fill:none;stroke:#E8691B;stroke-width:5;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:cmDraw 1.1s .5s cubic-bezier(.6,.1,.2,1) forwards}
@keyframes cmDraw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.hero h1 .u path{animation:none;stroke-dashoffset:0}}
.hero-eyebrow{display:inline-flex;align-items:center;gap:10px;margin:0 0 22px;padding:7px 14px 7px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);font:600 .8rem/1 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:#E1E8F7}
.hero-eyebrow b{display:inline-grid;place-items:center;height:22px;padding:0 9px;border-radius:999px;background:#E8691B;color:#fff;font-weight:700;letter-spacing:.06em}
.hero .lead{font-size:1.2rem;line-height:1.65}
.hero .lead strong{color:#fff;font-weight:600}
.kicker{display:inline-flex!important;align-items:center;gap:10px;font:700 .74rem var(--fb)!important;letter-spacing:.16em!important;margin-bottom:10px!important}
.kicker::before{content:"";width:26px;height:2px;border-radius:2px;background:currentColor}
.block-ink .kicker,.promo-in .kicker{color:#FFB37A}
.head-row h2,.split-intro h2{font-weight:750;letter-spacing:-.025em}
.split-intro>p,.head-row p.muted{font-size:1.06rem;line-height:1.7}
.svc-list h3,.journey h3,.dest-card h3{letter-spacing:-.01em}
blockquote,.quote{font-family:var(--fs);font-style:italic}


/* ===== Accès rapides (accueil) ===== */
.quick{margin-top:-64px}
.quick-grid{border:0;border-radius:20px;box-shadow:0 30px 60px -20px rgba(11,21,48,.35),0 0 0 1px rgba(14,27,61,.06);background:#fff}
.quick-t{position:relative;gap:6px;padding:26px 22px 22px;border-right:1px solid var(--line-2);transition:background .25s,transform .25s}
.quick-t::before{content:"";position:absolute;left:22px;right:22px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.6,.1,.2,1)}
.quick-t:hover{background:linear-gradient(180deg,#FFF7F1,#fff 70%);color:var(--ink)}
.quick-t:hover::before,.quick-t:focus-visible::before{transform:scaleX(1)}
.qt-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.qt-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:#FFF1E6;color:var(--orange-d);transition:background .25s,color .25s,transform .25s}
.quick-t .qt-ic .i{color:inherit}
.quick-t:hover .qt-ic{background:var(--orange);color:#fff;transform:rotate(-6deg) scale(1.05)}
.qt-n{font:italic 500 1.05rem/1 var(--fs);color:#C9D1E3;transition:color .25s}
.quick-t:hover .qt-n{color:var(--orange)}
.quick-t strong{font:700 1.04rem/1.25 var(--fd);letter-spacing:-.01em;color:var(--ink)}
.quick-t small{font-size:.84rem;color:var(--muted);font-weight:500;line-height:1.35}
.qt-go{margin-top:10px;font-size:.8rem;font-weight:700;color:var(--orange-d);opacity:0;transform:translateX(-6px);transition:opacity .25s,transform .25s}
.quick-t:hover .qt-go,.quick-t:focus-visible .qt-go{opacity:1;transform:none}
@media(hover:none){.qt-go{display:none}}
.hero-bg .ph-cr{top:14px;bottom:auto!important;right:14px}
@media(max-width:520px){.qt-ic{width:40px;height:40px;border-radius:12px}.quick-t small{display:none}}


/* ===== Bandeau final, newsletter, pied de page ===== */
.cta-band{background:#fff;padding:72px 0 0;color:#fff}
.cta-card{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(120deg,#0B1530,#1B3A8C);box-shadow:0 40px 80px -30px rgba(11,21,48,.55)}
.cta-bg{position:absolute;inset:0}.cta-bg .photo{position:absolute;inset:0;height:100%}.cta-bg img{object-fit:cover;width:100%;height:100%;opacity:.38}
.cta-card::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(100deg,rgba(11,21,48,.97) 0%,rgba(19,43,107,.86) 55%,rgba(19,43,107,.45) 100%)}
.cta-card::after{content:"";position:absolute;z-index:1;width:420px;height:420px;right:-120px;top:-180px;border-radius:50%;background:radial-gradient(circle,rgba(232,105,27,.45),transparent 65%);pointer-events:none}
.cta-in{position:relative;z-index:2;padding:56px 60px}
.cta-band .kicker{color:#FFB37A}
.cta-band h2{font-size:clamp(1.8rem,3.2vw,2.6rem);letter-spacing:-.03em;font-weight:800}
.cta-band p{font-size:1.06rem;color:#D3DDF4}
.cta-band .ph-cr{z-index:3;top:14px;bottom:auto!important;right:16px}
.cta-in>div:first-child{flex:1 1 520px;max-width:640px}
.cta-act .btn{box-shadow:0 10px 24px -8px rgba(232,105,27,.6)}
.cta-act .btn-ghost-w{box-shadow:none;backdrop-filter:blur(6px);background:rgba(255,255,255,.06)}
.foot-nl{background:linear-gradient(180deg,#fff 0 52%,var(--ink) 52%);padding:28px 0 0;margin-bottom:0}
.nl-card{border-radius:24px;background:#FFF5EC;border:1px solid #FBE1CC;padding:34px 40px}
.nl-txt{display:flex;gap:18px;align-items:flex-start}
.nl-ic{flex:0 0 auto;display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:var(--orange);color:#fff;box-shadow:0 12px 24px -10px rgba(232,105,27,.7);transform:rotate(-6deg)}
.nl-ic .i{color:#fff}
.foot-nl h3{color:var(--ink);font-size:1.4rem;letter-spacing:-.02em}
.foot-nl p{color:var(--muted)}
.foot-nl .kicker{color:var(--orange-d)}
.nl-row{background:#fff;border:1px solid #F1D3BA;border-radius:999px;padding:6px;gap:6px;box-shadow:0 8px 20px -12px rgba(11,21,48,.25)}
.nl-row:focus-within{border-color:var(--orange);box-shadow:0 0 0 4px rgba(232,105,27,.15)}
.nl-row input{border:0!important;background:transparent;box-shadow:none!important;padding:.65em 1em;outline:0}
.nl-row .btn{border-radius:999px;padding-inline:1.5em}
.foot-nl .chk{color:var(--muted);padding-left:10px}
.foot-nl .chk input{accent-color:var(--orange)}
.nl-msg{color:#B4470E}
.nl-ok{color:var(--ink)}.nl-ok .i{color:#1C8A4E}
footer{margin-top:0}
#foot>.wrap{padding-top:64px}
footer h4{position:relative;padding-bottom:12px;margin-bottom:18px;font-size:1rem;letter-spacing:-.005em}
footer h4::after{content:"";position:absolute;left:0;bottom:0;width:28px;height:2px;border-radius:2px;background:var(--orange)}
footer ul a{display:inline-flex;align-items:center;gap:0;transition:color .2s,gap .2s}
footer ul a::before{content:"";width:0;height:2px;background:var(--orange);border-radius:2px;transition:width .2s}
footer ul a:hover{gap:8px}footer ul a:hover::before{width:10px}
.foot-contact li{align-items:flex-start}
.foot-contact .i{flex:0 0 auto;box-sizing:content-box;padding:7px;border-radius:10px;background:rgba(255,179,122,.1);margin-top:-4px!important}
.foot-contact a::before{display:none}
.foot-logo{box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.foot-b{border-top:1px solid rgba(255,255,255,.08)}
@media(max-width:860px){.cta-in{padding:40px 26px}.nl-card{padding:26px 22px}.nl-row{flex-direction:row}.nl-txt{flex-direction:column}}
@media(max-width:480px){.nl-row{flex-direction:column;border-radius:18px}.nl-row .btn{width:100%}}


/* ===== Cartes guides ===== */
.guide-grid{gap:26px}
.guide-card{padding:0;border:0;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 1px 0 rgba(14,27,61,.04),0 0 0 1px rgba(14,27,61,.07),0 18px 40px -26px rgba(14,27,61,.35);transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.guide-card:hover{transform:translateY(-6px);border-color:transparent;box-shadow:0 0 0 1px rgba(232,105,27,.35),0 30px 60px -28px rgba(14,27,61,.45)}
.gc-media{position:relative;height:170px;overflow:visible}
.gc-media .photo{position:absolute;inset:0;height:100%;border-radius:0;overflow:hidden}
.gc-media img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.guide-card:hover .gc-media img{transform:scale(1.07)}
.gc-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,21,48,0) 40%,rgba(11,21,48,.55));pointer-events:none}
.gc-ic{position:absolute;left:24px;bottom:-24px;z-index:3;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--orange);color:#fff;box-shadow:0 0 0 5px #fff,0 12px 22px -10px rgba(232,105,27,.8);transition:transform .3s}
.gc-ic .i{color:#fff}
.guide-card:hover .gc-ic{transform:rotate(-8deg)}
.gc-body{display:flex;flex-direction:column;flex:1;padding:40px 26px 24px}
.gc-n{display:flex;align-items:center;gap:8px;font:600 .74rem/1 var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gc-n i{width:4px;height:4px;border-radius:50%;background:var(--orange)}
.guide-card h3{margin:10px 0 8px;font-size:1.3rem;letter-spacing:-.02em}
.guide-card p{line-height:1.6}
.gc-go{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);font-weight:700;font-size:.92rem;color:var(--royal)}
.gc-go b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--mist);color:var(--royal);transition:background .25s,color .25s,transform .25s}
.guide-card:hover .gc-go{color:var(--orange-d)}
.guide-card:hover .gc-go b{background:var(--orange);color:#fff;transform:translateX(3px)}
@media(prefers-reduced-motion:reduce){.guide-card,.gc-media img{transition:none}}


/* ===== Connexion étudiant v2 ===== */
.au{background:radial-gradient(800px 400px at 0% 0%,rgba(232,105,27,.07),transparent 60%),radial-gradient(900px 500px at 100% 100%,rgba(27,58,140,.08),transparent 60%),var(--mist)}
.au-in{border-radius:28px;box-shadow:0 40px 90px -40px rgba(14,27,61,.45),0 0 0 1px rgba(14,27,61,.06)}
.au-bg{position:absolute;inset:0;z-index:0}.au-bg .photo{position:absolute;inset:0;height:100%}.au-bg img{width:100%;height:100%;object-fit:cover}
.au.student .au-side{background:#0E1B3D}
.au.student .au-side::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(165deg,rgba(11,21,48,.92) 0%,rgba(19,43,107,.88) 45%,rgba(27,58,140,.78) 100%)}
.au-side>*{position:relative;z-index:2}.au-side>.au-bg{position:absolute;z-index:0}.au.student .au-side::before{z-index:1!important}
.au-side h2{font-size:2rem;letter-spacing:-.03em}
.au-side h2 em{font-family:var(--fs);font-style:italic;font-weight:500;color:#FFB37A}
.au-pts li>span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(4px)}
.au-dest{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.au-d{position:relative;display:block;height:64px;border-radius:12px;overflow:hidden;text-decoration:none;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.au-d .photo{position:absolute;inset:0;height:100%}.au-d img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.au-d::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 30%,rgba(11,21,48,.8))}
.au-d span{position:absolute;left:8px;bottom:6px;z-index:2;color:#fff;font:700 .74rem var(--fb)}
.au-d:hover img{transform:scale(1.1)}
.au-pay{display:flex;flex-wrap:wrap;gap:6px}
.au-pay span{font:700 .7rem/1 var(--fb);letter-spacing:.04em;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#E1E8F7}
.au-stats b{font-size:1.8rem;color:#fff}
.au-main{background:linear-gradient(180deg,#fff,#FBFCFF)}
.au-card h1{font-size:2rem;letter-spacing:-.03em}
.au-seg{background:#F0F3F9;border-radius:14px;padding:5px}
.au-seg button{border-radius:10px;padding:.7em}
.au-seg button.on{color:var(--orange-d);box-shadow:0 4px 12px -4px rgba(14,27,61,.2)}
.au .f>label{font-size:.86rem;font-weight:700;color:var(--ink)}
.inp{border-radius:13px;background:#F7F9FC;border-color:#E3E8F1}
.inp:hover{border-color:#CBD3E3}
.inp:focus-within{background:#fff;border-color:var(--orange);box-shadow:0 0 0 4px rgba(232,105,27,.14)}
.inp:focus-within>.i{color:var(--orange-d)}
.au-chk input{accent-color:var(--orange)}
.au-btn{border-radius:13px;padding:1em;font-weight:700;box-shadow:0 14px 26px -12px rgba(232,105,27,.75);transition:transform .2s,box-shadow .2s}
.au-btn:hover{transform:translateY(-2px)}
.btn-b.au-btn{box-shadow:0 14px 26px -12px rgba(27,58,140,.7)}
@media(max-width:860px){.au-dest,.au-pay{display:none}}


/* ===== Pages légales ===== */
.page-h h1 em{font-family:var(--fs);font-style:italic;font-weight:500;color:var(--orange-d)}
.page-h{position:relative;overflow:hidden;background:radial-gradient(700px 300px at 90% 0%,rgba(232,105,27,.10),transparent 60%),radial-gradient(600px 300px at 0% 100%,rgba(27,58,140,.08),transparent 60%),var(--mist)}
.lg-wrap{background:linear-gradient(180deg,#fff,#FAFBFE)}
.lg-grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:48px;align-items:start}
.lg-toc{position:sticky;top:110px;background:#fff;border-radius:20px;padding:22px;box-shadow:0 0 0 1px rgba(14,27,61,.07),0 18px 40px -28px rgba(14,27,61,.35)}
.lg-toc ol{list-style:none;margin:8px 0 18px;padding:0;display:grid;gap:4px}
.lg-toc button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;font:600 .9rem var(--fb);color:var(--ink);cursor:pointer;transition:background .2s,color .2s}
.lg-toc button .i{color:#9AA4BB;transition:color .2s}
.lg-toc button:hover{background:#FFF4EB;color:var(--orange-d)}.lg-toc button:hover .i{color:var(--orange)}
.lg-help{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--mist)}
.lg-help .i{color:var(--royal-2)}.lg-help b{display:block;font-size:.88rem}.lg-help a{font-size:.86rem;font-weight:700}
.lg-main{max-width:none}
.lg-notice{display:flex;gap:10px;border-radius:16px!important;margin-bottom:26px}
.lg-sec{background:#fff;border-radius:22px;padding:30px 34px;margin-bottom:20px;box-shadow:0 0 0 1px rgba(14,27,61,.06),0 14px 34px -26px rgba(14,27,61,.3);scroll-margin-top:110px}
.lg-h{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.lg-ic{flex:0 0 auto;display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#FFF1E6;color:var(--orange-d)}
.lg-n{display:block;font:italic 500 .95rem/1 var(--fs);color:var(--orange)}
.lg-sec h2{margin:2px 0 0!important;font-size:1.55rem;letter-spacing:-.02em}
.lg-sec p{color:#3C4763;line-height:1.75;max-width:72ch}
.cr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:18px}
.cr-card{margin:0;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(14,27,61,.08);display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.cr-card:hover{transform:translateY(-3px);box-shadow:0 0 0 1px rgba(232,105,27,.35),0 16px 30px -18px rgba(14,27,61,.4)}
.cr-img{display:block;height:120px;overflow:hidden;background:var(--mist)}
.cr-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.cr-card:hover .cr-img img{transform:scale(1.06)}
.cr-card figcaption{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
.cr-card b{font-size:.86rem;color:var(--ink);line-height:1.3}
.cr-l{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px}
.cr-card figcaption{flex:1}
.cr-l a{font-weight:700;font-size:.76rem;text-decoration:none}
.cr-l a:first-child{padding:2px 8px;border-radius:999px;background:#EEF2FB;color:var(--royal-2)}
@media(max-width:960px){.lg-grid{grid-template-columns:1fr}.lg-toc{position:static}.lg-sec{padding:24px 20px}}


/* ===== Pages légales v2 ===== */
.lg-prog{position:fixed;top:0;left:0;right:0;z-index:1000;height:3px;pointer-events:none}
.lg-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#FFB37A);transform:scaleX(0);transform-origin:left;transition:transform .1s linear}
.lg-toc button{position:relative}
.lg-toc button.on{background:#FFF4EB;color:var(--orange-d)}
.lg-toc button.on .i{color:var(--orange)}
.lg-toc button.on::before{content:"";position:absolute;left:-22px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
.lg-toc .lg-print{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 12px;padding:10px;border:1.5px dashed #D3DAE8;border-radius:12px;background:#fff;font:700 .86rem var(--fb);color:var(--royal);cursor:pointer;transition:border-color .2s,color .2s}
.lg-toc .lg-print:hover{border-color:var(--orange);color:var(--orange-d)}
.lg-tbc{display:inline-block;padding:2px 9px;border-radius:999px;background:#FFF4E5;color:#9A5A00;font:700 .74rem/1.6 var(--fb);border:1px dashed #F2C27A}
.lg-dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:16px 0 0}
.lg-dl>div{padding:14px 16px;border-radius:14px;background:#F7F9FC;border:1px solid #EAEEF5}
.lg-dl dt{display:flex;align-items:center;gap:7px;font:700 .72rem var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.lg-dl dt .i{color:var(--orange)}
.lg-dl dd{margin:0;font-weight:700;color:var(--ink)}
.lg-dl dd small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
.lg-dl a{text-decoration:none}
.lg-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}
.lg-cards>div{padding:16px;border-radius:16px;border:1px solid #EAEEF5;background:#fff}
.lg-cards span{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#EEF2FB;color:var(--royal-2);margin-bottom:10px}
.lg-cards b{display:block;color:var(--ink);margin-bottom:4px}
.lg-cards p{margin:0;font-size:.9rem;line-height:1.55!important}
.lg-rights{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 20px;border-radius:16px;background:linear-gradient(120deg,#0E1B3D,#1B3A8C);color:#fff;margin:6px 0 14px}
.lg-rights b{display:block;margin-bottom:8px}
.lg-rights small{display:block;margin-top:10px;color:#C9D3EA}
.lg-chips{display:flex;gap:6px;flex-wrap:wrap}
.lg-chips span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:.82rem;font-weight:600}
.lg-small{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)!important;margin:0}
.lg-small .i{color:#1C8A4E}
.lg-table{margin-top:14px;border:1px solid #EAEEF5;border-radius:16px;overflow:hidden}
.lg-tr{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:12px;padding:13px 18px;border-top:1px solid #EEF1F6;font-size:.92rem;align-items:center}
.lg-tr:first-child{border-top:0}
.lg-th{background:#F7F9FC;font:700 .72rem var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lg-ok,.lg-off{justify-self:start;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.lg-ok{background:#E7F6EE;color:#17663D}.lg-off{background:#FDECEC;color:#A12A2A}
.lg-terms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.lg-terms>div{padding:18px;border-radius:16px;border:1px solid #EAEEF5}
